name: chatai
description: Orbita — Windows desktop chat client (Microsoft Store / MSIX). Powered by xAI Grok.
publish_to: "none"
version: 0.1.2+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.9.2
  file_picker: ^7.0.2
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.16.8

flutter:
  uses-material-design: true
  generate: true

# =============================================================================
# MSIX / Microsoft Store packaging
# Identity values below match Partner Center → Product identity (exact strings).
# Package Family Name is derived by Store from Name + Publisher — expected:
#   PrecisionToolsLab.OrbitaAI_2h9tr0fqkywqe  (do not invent / hardcode PFN)
#
# Build Store package (unsigned; Store signs on upload):
#   dart run msix:create --store ^
#     --windows-build-args="--dart-define=MS_STORE_PRO_PRODUCT_ID=pro_monthly" ^
#     --output-path=..\..\dist\msix --output-name=Orbita
# Or: powershell -File scripts\build_store_msix.ps1
#
# Store notes:
# - Device family: Windows 10/11 Desktop (not Xbox/HoloLens/etc.)
# - runFullTrust: Orbita AI is a full-trust Flutter desktop Win32 app
#   (local files, microphone, network chat). Restricted AppContainer is not
#   viable; request runFullTrust approval in Partner Center submission notes.
# =============================================================================
msix_config:
  display_name: Orbita AI
  publisher_display_name: Precision Tools Lab
  identity_name: PrecisionToolsLab.OrbitaAI
  publisher: CN=97082A87-14EA-4209-8039-A9443BD7AD27
  msix_version: 0.1.2.0
  # true = Store-upload package (unsigned). Sideload/dev: build without --store
  # and/or override via CLI. Default here matches Store target.
  store: true
  capabilities: internetClient, microphone
  languages: en-us, vi-vn, zh-cn, ja-jp, ko-kr, es-es, fr-fr, de-de, pt-br, hi-in
  # Bake Pro product id into Release binary (must match Partner Center add-on Store ID)
  windows_build_args: --dart-define=MS_STORE_PRO_PRODUCT_ID=pro_monthly
  output_path: ../../dist/msix
  output_name: Orbita
