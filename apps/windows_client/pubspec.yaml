name: chatai
description: Orbita — Windows desktop chat client (Microsoft Store / MSIX). Powered by xAI Grok.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.9.2
  file_picker: ^7.0.2
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.16.8

flutter:
  uses-material-design: true
  generate: true

# =============================================================================
# MSIX / Microsoft Store packaging
# Before certification upload, replace EVERY PLACEHOLDER_* value below with the
# exact strings from Partner Center → your app → Product identity
# (or Package/Identity after you reserve the name):
#
#   Partner Center field          → msix_config key
#   ----------------------------    -----------------
#   Package/Identity Name         → identity_name
#   Package/Identity Publisher    → publisher          (full CN=… string)
#   Publisher display name        → publisher_display_name
#   (app display name)            → display_name
#
# Package Family Name (PFN) is derived by Store from Name + Publisher — do not
# invent it here. Keep identity_name stable once the app is associated.
#
# Build Store package (unsigned; Store signs on upload):
#   dart run msix:create --store ^
#     --windows-build-args="--dart-define=MS_STORE_PRO_PRODUCT_ID=pro_monthly" ^
#     --output-path=..\..\dist\msix --output-name=Orbita
# Or: powershell -File scripts\build_store_msix.ps1
#
# Store note — runFullTrust: Orbita is a full-trust Flutter desktop Win32 app
# (local files, microphone, network chat). Restricted AppContainer is not viable;
# request runFullTrust approval in Partner Center submission notes.
# =============================================================================
msix_config:
  display_name: Orbita AI
  # Partner Center → Publisher display name (fixed after Partner Center rejection)
  publisher_display_name: Precision Tools Lab
  # TODO(Partner Center): paste Package/Identity Name (e.g. 12345Publisher.Orbita)
  identity_name: PLACEHOLDER.Orbita
  # TODO(Partner Center): paste Package/Identity Publisher exactly (starts with CN=)
  publisher: CN=PLACEHOLDER-Publisher-GUID
  msix_version: 0.1.0.0
  # true = Store-upload package (unsigned). Sideload/dev: build without --store
  # and/or override via CLI. Default here matches Store target.
  store: true
  capabilities: internetClient, microphone
  languages: en-us, vi-vn
  # Bake Pro product id into Release binary (must match Partner Center add-on Store ID)
  windows_build_args: --dart-define=MS_STORE_PRO_PRODUCT_ID=pro_monthly
  output_path: ../../dist/msix
  output_name: Orbita
